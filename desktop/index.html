<!doctype html>
<meta charset="utf-8">
<title>Replicate</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 14px system-ui, sans-serif; background: #16181d; color: #e6e8ec; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid #2a2e37; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #bascule { padding: 7px 16px; border: 0; border-radius: 6px;
             background: #3a3f4b; color: #e6e8ec; cursor: pointer; font: inherit; }
  #bascule.actif { background: #2e7d4f; }
  #resume { color: #8b93a3; font-size: 13px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px solid #22252c; }
  li.hors-ligne { opacity: .45; }
  /* Le message occupe toute la largeur d'une seconde ligne: les raisons de
     refus rendues par rejouer() sont longues et ne doivent pas etre tronquees. */
  .message { flex-basis: 100%; margin: -2px 0 0 42px; color: #d9a48f; font-size: 12px; }
  .etoile { cursor: pointer; font-size: 16px; color: #6b7280; user-select: none; }
  .etoile.on { color: #e0b040; }
  .nom { width: 130px; font-weight: 600; }
  .perso { flex: 1; color: #b9c0cc; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #2a2e37; color: #9aa3b2; }
  .badge.maitre { background: #2e5d8a; color: #dbeafe; }
  .badge.alerte { background: #7a3b2e; color: #ffdcd2; }
  #erreur { padding: 10px 18px; background: #7a3b2e; color: #ffdcd2; }
  #erreur:empty { display: none; }
  .icone { width: 15px; height: 15px; flex: none; color: #8b93a3; }
  .sw { display: inline-flex; align-items: center; gap: 5px; }
  .sw input { accent-color: #2e7d4f; }
  #delai { width: 58px; background: #22252c; color: #e6e8ec; border: 1px solid #3a3f4b;
           border-radius: 5px; padding: 4px 6px; font: inherit; }
  #bpt { padding: 7px 14px; border: 0; border-radius: 6px; background: #3a3f4b;
         color: #e6e8ec; cursor: pointer; font: inherit; }
  #bpt.actif { background: #2e7d4f; }
  #binv { padding: 7px 14px; border: 0; border-radius: 6px; background: #3a3f4b;
          color: #e6e8ec; cursor: pointer; font: inherit; }
  #binv.actif { background: #2e7d4f; }
  #banim { padding: 7px 14px; border: 0; border-radius: 6px; background: #3a3f4b;
           color: #e6e8ec; cursor: pointer; font: inherit; }
  #banim.actif { background: #2e7d4f; }
</style>
<header>
  <h1>Replicate</h1>
  <button id="bascule">INACTIF</button>
  <button id="bpt">PASSE-TOUR</button>
  <button id="binv">GROUPE</button>
  <button id="banim">ANIM</button>
  <label style="color:#8b93a3">délai <input id="delai" type="number" min="0" step="0.1" value="0"></label>
  <span id="resume" style="margin-left:auto"></span>
</header>
<div id="erreur"></div>
<ul id="liste"></ul>
<script>
  const LIBELLES = {
    'hors-ligne': 'hors ligne',
    'intercepte': 'suit',
    'non-intercepte': 'non intercepté — relance ce client',
    'erreur': 'erreur',
    'inconnu': 'compte inconnu',
  };
  // Icones redessinees d'apres le launcher de krm35: elles suivent la couleur
  // du texte, donc le theme, et n'ajoutent aucun fichier ni dependance.
  const ICONE_REPLICATE =
    '<svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">' +
    '<line x1="12" y1="3" x2="12" y2="21"/><line x1="4.2" y1="7.5" x2="19.8" y2="16.5"/>' +
    '<line x1="4.2" y1="16.5" x2="19.8" y2="7.5"/></svg>';
  const ICONE_PASSE =
    '<svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
    '<circle cx="12" cy="12" r="9"/><line x1="5.6" y1="18.4" x2="18.4" y2="5.6"/></svg>';
  const ICONE_GROUPE =
    '<svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round">' +
    '<circle cx="9" cy="8" r="3.2"/><path d="M3.2 19.5c0-3.2 2.6-5.2 5.8-5.2s5.8 2 5.8 5.2"/>' +
    '<path d="M16.4 5.2a3.2 3.2 0 0 1 0 5.9"/><path d="M17.6 14.6c2.1.5 3.6 2.3 3.6 4.9"/></svg>';
  const ICONE_ANIM =
    '<svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round">' +
    '<circle cx="12" cy="4.6" r="2.2"/><path d="M9 21l2.2-5.2 2.4 2.2 1 3"/>' +
    '<path d="M7.4 12.2l3.4-2.6 2.6 1.4 2.6 2.4"/><line x1="4" y1="20" x2="20" y2="4"/></svg>';

  function interrupteur(icone, coche, desactive, surChangement) {
    const l = document.createElement('label');
    l.className = 'sw';
    const c = document.createElement('input');
    c.type = 'checkbox';
    c.checked = coche;
    c.disabled = desactive;
    c.addEventListener('change', () => surChangement(c.checked));
    const i = document.createElement('span');
    i.innerHTML = icone;
    l.append(c, i);
    return l;
  }

  let actif = false;
  let passeTourActif = false;
  let invitationActive = false;
  let noAnimActif = false;

  document.getElementById('bascule').addEventListener('click', () => {
    actif = !actif;
    window.app.basculerReplicate(actif);
  });

  document.getElementById('bpt').addEventListener('click', () => {
    passeTourActif = !passeTourActif;
    window.app.basculerPasseTour(passeTourActif);
  });

  document.getElementById('binv').addEventListener('click', () => {
    invitationActive = !invitationActive;
    window.app.basculerInvitation(invitationActive);
  });

  document.getElementById('banim').addEventListener('click', () => {
    noAnimActif = !noAnimActif;
    window.app.basculerNoAnim(noAnimActif);
  });

  document.getElementById('delai').addEventListener('change', (e) => {
    window.app.reglerDelai(e.target.value);
  });

  window.app.surEtat((etat) => {
    actif = etat.replicate;
    const b = document.getElementById('bascule');
    b.textContent = actif ? 'ACTIF' : 'INACTIF';
    b.classList.toggle('actif', actif);

    passeTourActif = etat.passeTourActif;
    const bpt = document.getElementById('bpt');
    bpt.classList.toggle('actif', passeTourActif);

    invitationActive = etat.invitationActive;
    document.getElementById('binv').classList.toggle('actif', invitationActive);

    noAnimActif = etat.noAnimActif;
    document.getElementById('banim').classList.toggle('actif', noAnimActif);

    const champDelai = document.getElementById('delai');
    if (document.activeElement !== champDelai) champDelai.value = etat.delai;

    document.getElementById('erreur').textContent = etat.erreurComptes || '';

    // « en jeu » = derriere notre proxy, y compris un client dont le compte
    // n'est pas dans la liste du launcher.
    const enJeu = etat.lignes.filter((l) => l.suivi).length;
    document.getElementById('resume').textContent =
      `${enJeu} compte${enJeu > 1 ? 's' : ''} en jeu`;

    const liste = document.getElementById('liste');
    liste.textContent = '';
    for (const l of etat.lignes) {
      const li = document.createElement('li');
      li.className = l.etat;

      const etoile = document.createElement('span');
      etoile.className = 'etoile' + (l.favori ? ' on' : '');
      etoile.textContent = l.favori ? '★' : '☆';
      etoile.title = 'à lancer';
      if (l.id !== null) {
        etoile.addEventListener('click', () => window.app.marquerFavori(l.id, !l.favori));
      }

      // Un interrupteur desactive quand le compte n'est pas intercepte serait
      // une promesse fausse: hors ligne, non intercepte ou en erreur, aucun
      // des quatre ne peut agir sur ce client.
      //
      // C'est `suivi` qui en decide, PAS le libelle `etat`: un client passe par
      // notre proxy mais dont le compte est absent de la liste Zaap s'affiche
      // « compte inconnu » tout en etant parfaitement pilotable. Tester
      // l'etat le rendait indebrayable — c'est precisement pour cela que
      // `suivi` existe.
      const utilisable = l.id !== null && l.suivi;
      const swRep = interrupteur(ICONE_REPLICATE, !l.exclu, !utilisable,
        (v) => window.app.exclureCompte(l.id, !v));
      const swPasse = interrupteur(ICONE_PASSE, l.passeTour, !utilisable,
        (v) => window.app.basculerPasseTourCompte(l.id, v));
      const swInv = interrupteur(ICONE_GROUPE, l.invitation, !utilisable,
        (v) => window.app.basculerInvitationCompte(l.id, v));
      const swAnim = interrupteur(ICONE_ANIM, l.noAnim, !utilisable,
        (v) => window.app.basculerNoAnimCompte(l.id, v));

      const nom = document.createElement('span');
      nom.className = 'nom';
      nom.textContent = l.nickname;

      const perso = document.createElement('span');
      perso.className = 'perso';
      perso.textContent = l.personnage ? `${l.personnage} — ${l.classe}` : '—';

      const badge = document.createElement('span');
      badge.className = 'badge'
        + (l.estMaitre ? ' maitre' : '')
        + (l.etat === 'non-intercepte' || l.etat === 'erreur' ? ' alerte' : '');
      badge.textContent = l.estMaitre ? 'maître' : LIBELLES[l.etat];

      li.append(etoile, swRep, swPasse, swInv, swAnim, nom, perso, badge);

      // Echec d'attache, ou raison pour laquelle la derniere action n'a pas pu
      // etre rejouee chez ce compte.
      if (l.message) {
        const message = document.createElement('span');
        message.className = 'message';
        message.textContent = l.message;
        li.append(message);
      }

      liste.append(li);
    }
  });
</script>
