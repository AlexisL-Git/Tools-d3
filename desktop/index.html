<script>
  const LIBELLE = {
    'hors-ligne': 'hors ligne',
    'intercepte': '',
    'en-attente': 'attente',
    'non-intercepte': 'non intercepté',
    'erreur': 'erreur',
    'inconnu': '',
  };
  // Trois familles d'anomalie, trois formes. La couleur ne fait que renforcer:
  // huit a dix pour cent des hommes sont daltoniens, et l'ancien panneau
  // encodait « arme » en vert et « alerte » en rouge-brun, sans second signal.
  const FORME = {
    'non-intercepte': 'alerte',
    'erreur': 'alerte',
    'en-attente': 'attente',
    'hors-ligne': 'calme',
  };

  // Les memes regles que src/comptes/raccourcis.js, cote affichage. Le module
  // n'est pas importable ici: le renderer est sandboxe et n'a pas de require.
  // Il reste la reference, et main.js valide de son cote.
  const NOMS = {
    ArrowLeft: 'Left', ArrowRight: 'Right', ArrowUp: 'Up', ArrowDown: 'Down',
    ' ': 'Space', Enter: 'Return', Tab: 'Tab', Backspace: 'Backspace',
    Delete: 'Delete', Insert: 'Insert', Home: 'Home', End: 'End',
    PageUp: 'PageUp', PageDown: 'PageDown',
  };
  // >>> TABLE D'AFFICHAGE COPIEE DE src/comptes/raccourcis.js
  const AFFICHAGE = {
    CommandOrControl: 'Ctrl', Shift: 'Maj', Left: '←', Right: '→', Up: '↑',
    Down: '↓', Space: 'Espace', Return: 'Entrée', Backspace: 'Retour', Delete: 'Suppr',
    Souris4: 'M4', Souris5: 'M5', SourisMilieu: 'Molette',
  };
  // <<< FIN DE LA TABLE D'AFFICHAGE
  const MODIF = new Set(['Control', 'Alt', 'Shift', 'Meta', 'AltGraph']);

  // >>> COPIE DE src/comptes/raccourcis.js - NE PAS MODIFIER D'UN SEUL COTE
  // Le renderer tourne en bac a sable: il n'a pas de require, et un preload en
  // bac a sable ne peut charger que les modules d'Electron. Cette copie est
  // donc imposee, pas un oubli. test/souris-copie.test.js compare les deux par
  // leur COMPORTEMENT: modifier l'une sans l'autre rend npm test rouge.
  const BOUTONS = { 1: 'SourisMilieu', 3: 'Souris4', 4: 'Souris5' };
  const SOURIS = new Set(Object.values(BOUTONS));

  function accelerateurSourisDe(e) {
    const nom = BOUTONS[e.button];
    if (nom === undefined) return null;
    const parties = [];
    if (e.ctrlKey) parties.push('CommandOrControl');
    if (e.altKey) parties.push('Alt');
    if (e.shiftKey) parties.push('Shift');
    parties.push(nom);
    return parties.join('+');
  }
  // <<< FIN DE COPIE

  function accelerateurDe(e) {
    const k = e.key;
    if (typeof k !== 'string' || !k.length) return null;
    // Échap ANNULE la saisie: l'assigner rendrait l'annulation impossible.
    if (MODIF.has(k) || k === 'Escape') return null;
    const parties = [];
    if (e.ctrlKey) parties.push('CommandOrControl');
    if (e.altKey) parties.push('Alt');
    if (e.shiftKey) parties.push('Shift');
    parties.push(NOMS[k] || (k.length === 1 ? k.toUpperCase() : k));
    return parties.join('+');
  }

  const libelleTouche = (a) => (!a ? '' : a.split('+').map((p) => AFFICHAGE[p] || p).join('+'));

  // ---------------- le devlog ----------------
  // Charge au PREMIER clic seulement, puis garde. Le fichier fait partie de la
  // version installee: il ne change pas tant qu'OMNI tourne.
  let versionCourante = 'dev';
  let devlogCharge = null;

  function fermerQuoiDeNeuf() {
    document.getElementById('quoiDeNeuf').hidden = true;
  }

  function rendreDevlog(entrees) {
    const corps = document.getElementById('qdnCorps');
    corps.textContent = '';
    if (!entrees.length) {
      const vide = document.createElement('div');
      vide.className = 'qdn-vide';
      vide.textContent = 'Pas de notes pour cette version.';
      corps.append(vide);
      return;
    }
    for (const e of entrees) {
      const bloc = document.createElement('div');
      bloc.className = 'qdn-version';
      const titre = document.createElement('div');
      titre.className = 'qdn-titre';
      const num = document.createElement('b');
      num.textContent = e.version;
      titre.append(num);
      if (e.le) {
        const date = document.createElement('span');
        date.className = 'date';
        date.textContent = e.le;
        titre.append(date);
      }
      if (e.version === versionCourante) {
        const ici = document.createElement('span');
        ici.className = 'ici';
        ici.textContent = 'la tienne';
        titre.append(ici);
      }
      bloc.append(titre);
      const ul = document.createElement('ul');
      for (const n of e.notes) {
        const li = document.createElement('li');
        // textContent, jamais innerHTML: les notes sont du texte, et ce
        // fichier arrive par le reseau au meme titre que le reste du code.
        li.textContent = n;
        ul.append(li);
      }
      bloc.append(ul);
      corps.append(bloc);
    }
  }

  async function ouvrirQuoiDeNeuf() {
    if (devlogCharge === null) {
      try {
        devlogCharge = await window.app.devlog();
      } catch {
        devlogCharge = [];   // le devlog ne casse jamais la fenetre
      }
    }
    rendreDevlog(devlogCharge);
    verifierMajGit();   // relu a chaque ouverture: le panneau ne montre jamais un etat perime
    document.getElementById('quoiDeNeuf').hidden = false;
  }

  document.getElementById('versionBouton').onclick = ouvrirQuoiDeNeuf;
  document.getElementById('qdnFermer').onclick = fermerQuoiDeNeuf;

  // ---------------- le retard sur le depot (mode dev) ----------------
  // Les deux canaux n'ont d'ipcMain que sous OMNI_DEV. Chez un ami l'invoke
  // REJETTE, et c'est normal: le bloc reste cache et le numero de version ne
  // change pas de couleur. Surtout pas « a jour » -- ne pas savoir n'est pas
  // une reponse, c'est la regle que canal.js et veille.js tiennent deja.
  //
  // Dans la barre, un seul signal: le numero passe au cyan. Tout le reste vit
  // dans le panneau que ce numero ouvre, parce que la barre de titre etait
  // devenue illisible avec un texte et un bouton de plus.
  // PAS DE BOUTON DE MISE A JOUR ICI, et c'est delibere. Il a existe le
  // 2026-09-02 et il est parti le jour meme: en developpement le dossier de
  // travail est presque toujours modifie, `merge --ff-only` refusait donc, et
  // il ne restait a l'ecran qu'un pave d'erreur git en anglais. Ce bloc dit ou
  // on en est et quelle commande taper. Mettre a jour reste un geste conscient.
  const elMajBloc = document.getElementById('qdnMaj');
  const elMajQuoi = document.getElementById('qdnMajQuoi');
  const elMajRefs = document.getElementById('qdnMajRefs');

  function rendreMajGit(r) {
    const retard = !!r && r.etat === 'en-retard';
    document.getElementById('versionBouton').classList.toggle('retard', retard);
    elMajBloc.classList.toggle('retard', retard);
    elMajBloc.hidden = false;

    if (!r || r.etat === 'inconnu') {
      elMajQuoi.textContent = 'Mise à jour non vérifiée';
      elMajRefs.textContent = (r && r.raison) || '';
      return;
    }
    if (r.etat === 'a-jour') {
      elMajQuoi.textContent = 'Code à jour';
      elMajRefs.textContent = r.branche + ' · ' + r.locale + ' · rien de neuf sur ' + r.reference;
      return;
    }
    elMajQuoi.textContent = r.retard + ' commit' + (r.retard > 1 ? 's' : '') + ' de retard sur ' + r.reference;
    // La commande, pas le geste: `--ff-only` refuse au lieu de fusionner, et
    // git dira lui-meme ce qui bloque, dans un terminal ou on peut le lire.
    elMajRefs.textContent = r.branche + ' · ' + r.locale + ' → ' + r.distante
      + (r.propre === false ? ' · dossier de travail modifié' : '')
      + ' · git pull --ff-only';
  }

  async function verifierMajGit() {
    try {
      rendreMajGit(await window.app.etatMajGit());
    } catch {
      elMajBloc.hidden = true;     // pas de canal = mode ami: on n'affiche rien
      document.getElementById('versionBouton').classList.remove('retard');
    }
  }

  // APRES l'ouverture de la fenetre, jamais avant: un depot distant
  // injoignable ne doit pas retarder l'affichage d'une seule seconde.
  setTimeout(verifierMajGit, 600);

  // Une touche NUE est CONFISQUEE a Dofus. Un bouton de souris, non: on lit
  // son etat, le jeu le recoit aussi. Deux situations opposees, deux textes.
  // Rend la raison, ou null s'il n'y a rien a signaler.
  function risqueDe(a) {
    if (!a) return null;
    const parties = a.split('+');
    const nom = parties[parties.length - 1];
    if (SOURIS.has(nom)) {
      return nom === 'SourisMilieu' ? 'Dofus recevra aussi ce clic' : null;
    }
    if (parties.length === 1 && !/^F([1-9]|1[0-9]|2[0-4])$/.test(nom)) {
      return 'Dofus ne recevra plus cette touche tant qu OMNI tourne';
    }
    return null;
  }

  // ---------------- le tableau des archimonstres ----------------
  //
  // IL NE DEMANDE RIEN AU JEU. L'inventaire arrive seul a la connexion, et
  // main.js n'a qu'a croiser ce qu'il a deja: ouvrir le tableau ne coute pas un
  // aller-retour, et il est juste au moment ou on le regarde.
  //
  // Il est CONSTRUIT A CHAQUE OUVERTURE, jamais garde: une pierre qui se
  // remplit pendant la chasse arrive en `iua`, et un tableau garde en memoire
  // vieillirait sans le dire.
  let arcVise = null;     // le personnage dont on a clique le bouton
  let arcFiltre = 'tous';
  let arcVue = 'liste';
  let arcQuoi = 'archi';
  let arcTable = null;
  // Les zones depliees, et les sous-zones depliees. Des Set et pas des
  // drapeaux: on peut en ouvrir plusieurs, et l'ouverture survit au redessin.
  const arcOuvertes = new Set();
  const arcOuvertesSz = new Set();

  // LES CLASSES DU TABLEAU, DECLAREES EN UN SEUL ENDROIT ET TOUTES PREFIXEES.
  //
  // Ce n'est pas une coquetterie, c'est une reparation. Le 04/09, les cellules
  // s'appelaient `case` -- un nom deja pris par le losange des cinq colonnes
  // d'une ligne de compte, qui porte `display: grid`. Les <td> heritaient de ce
  // display, sortaient de la mise en table, et les quatre coches d'un
  // archimonstre s'empilaient VERTICALEMENT dans la premiere colonne au lieu de
  // se repartir sur les quatre personnages.
  //
  // Le balisage etait juste et le code aussi: seul un nom etait deja pris, et
  // rien ne pouvait le dire -- le navigateur n'a aucune raison de se plaindre.
  // Un test lit cette table et refuse toute classe non prefixee.
  const ARC = {
    gauche: 'arc-gauche',
    niv: 'arc-niv',
    cellule: 'arc-case',
    presente: 'arc-a',
    visee: 'arc-vise',
    vide: 'arc-aucun',
    zone: 'arc-zone',
    sousZone: 'arc-sz',
    fleche: 'arc-fleche',
    nomZone: 'arc-nom',
    nombre: 'arc-nb',
    zero: 'arc-zero',
    qui: 'arc-qui',
    abrev: 'arc-abrev',
    archi: 'arc-archi',
    niveau: 'arc-niveau',
  };

  // Assemble une liste de classes en ecartant les absentes.
  const classesDe = (...noms) => noms.filter(Boolean).join(' ');

  const echapper = (t) => String(t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  function fermerArchi() {
    document.getElementById('vueArchi').hidden = true;
  }

  async function ouvrirArchi(pid) {
    arcVise = pid === undefined ? null : pid;
    // LE PANNEAU S'OUVRE MEME EN ECHEC, ET DIT POURQUOI.
    //
    // Cette fonction est `async`: toute exception y devient un rejet que
    // personne n'attrape, et sans ce filet le panneau reste simplement ferme --
    // l'utilisateur voit un bouton qui « ne fait rien ». C'est arrive le 04/09,
    // une fonction disparue dans une reecriture, et rien nulle part ne l'a dit.
    try {
      // LE PERSONNAGE SUIVI PART AVEC LA DEMANDE: c'est lui qui decide de ce
      // que « manquant » veut dire dans la vue par zone.
      arcTable = await window.app.tableauArchi(arcVise, arcQuoi);
      dessinerArchi();
    } catch (e) {
      arcTable = null;
      document.getElementById('arcCorps').innerHTML = '<div class="' + ARC.archi + '">'
        + 'Le tableau n’a pas pu être construit : '
        + echapper(e && e.message ? e.message : String(e)) + '</div>';
      document.getElementById('arcPied').textContent = '';
    }
    document.getElementById('vueArchi').hidden = false;
  }

  // L'embleme de classe d'un personnage, repris du cache de la liste des
  // comptes -- rien n'est retelecharge. Sans embleme en cache, l'abreviation de
  // classe tient la place, exactement comme sur sa ligne.
  function emblemeDe(pid, titre) {
    const l = (dernieresLignes || []).find((x) => x.pid === pid);
    if (!l) return '';
    if (l.embleme) {
      return '<img src="' + l.embleme + '" alt="' + echapper(l.classe || '')
        + '" title="' + echapper(titre) + '">';
    }
    return '<span class="' + ARC.abrev + '" title="' + echapper(titre) + '">'
      + echapper((l.classe || '?').slice(0, 3)) + '</span>';
  }

  const nomDuPid = (pid) => {
    const c = (arcTable.comptes || []).find((x) => x.pid === pid);
    return c ? c.nom : String(pid);
  };

  // OU CHASSER: les zones triees par ce qu'il y reste a prendre, depliables en
  // sous-zones. C'est la sous-zone qui dit ou aller; la zone dit ou est le gros
  // du travail.
  // Combien de personnages ont un inventaire lu. Sert a distinguer « tout est
  // pris » de « on ne sait rien » -- deux listes vides qui ne veulent pas du
  // tout dire la meme chose.
  const comptesLus = () => (arcTable.comptes || []).filter((c) => c.lu).length;

  function dessinerZones(corps) {
    const zones = arcTable.zones || [];

    // UNE LIGNE NE SE DEPLIE QUE S'IL Y A QUELQUE CHOSE DESSOUS. Un bouton mort
    // se prend le focus au clavier et promet un geste qui n'existe pas.
    const ligne = (nom, manquants, qui, classe, data, ouvrable, ouverte) => {
      const zero = manquants === 0 ? ' ' + ARC.zero : '';
      const emblemes = qui.map((pid) => emblemeDe(pid, nomDuPid(pid) + ' — il lui en manque ici')).join('');
      const balise = ouvrable ? 'button' : 'div';
      return '<' + balise + ' class="' + classe + '"' + (ouvrable ? ' ' + data : '') + '>'
        + '<span class="' + ARC.fleche + '">' + (ouvrable ? (ouverte ? '▾' : '▸') : '') + '</span>'
        + '<span class="' + ARC.nomZone + '">' + echapper(nom) + '</span>'
        + '<span class="' + ARC.qui + '">' + emblemes + '</span>'
        + '<span class="' + ARC.nombre + zero + '">' + manquants + '</span>'
        + '</' + balise + '>';
    };

    // Le troisieme niveau: ce qu'il manque NOMMEMENT. « Cimetière 6 » envoie
    // chasser sans savoir quelle pierre preparer; le niveau, lui, le dit.
    const archi = (r) => '<div class="' + ARC.archi + '">'
      + '<span class="' + ARC.fleche + '"></span>'
      + '<span class="' + ARC.nomZone + '">' + echapper(r.nom) + '</span>'
      + '<span class="' + ARC.niveau + '">niv ' + r.niveau + '</span>'
      + '<span class="' + ARC.qui + '">'
      + r.qui.map((pid) => emblemeDe(pid, nomDuPid(pid) + ' — il lui manque celui-la')).join('')
      + '</span></div>';

    // UNE LISTE VIDE DOIT LE DIRE. Depuis que les zones terminees
    // disparaissent, une collection finie rend zero ligne -- et un panneau
    // blanc ne se distingue pas d'un panneau casse.
    if (zones.length === 0) {
      corps.innerHTML = '<div class="' + ARC.archi + '">'
        + (comptesLus() === 0
          ? 'aucun inventaire lu : lance tes clients après OMNI, ou clique sur le bouton rond'
          : 'plus rien à chasser ici — tout est pris') + '</div>';
      return;
    }

    corps.innerHTML = zones.map((z) => {
      const ouverte = arcOuvertes.has(z.zone);
      let html = ligne(z.zone, z.manquants, z.qui, ARC.zone,
        'data-zone="' + echapper(z.zone) + '"', true, ouverte);
      if (!ouverte) return html;
      for (const sz of z.sousZones) {
        const ouvrable = sz.restants.length > 0;
        const szOuverte = arcOuvertesSz.has(sz.id);
        html += ligne(sz.nom, sz.manquants, sz.qui, ARC.sousZone,
          'data-sz="' + sz.id + '"', ouvrable, szOuverte);
        if (ouvrable && szOuverte) html += sz.restants.map(archi).join('');
      }
      return html;
    }).join('');

    for (const b of corps.querySelectorAll('[data-zone]')) {
      b.addEventListener('click', () => {
        const z = b.dataset.zone;
        if (arcOuvertes.has(z)) arcOuvertes.delete(z);
        else arcOuvertes.add(z);
        dessinerArchi();
      });
    }
    for (const b of corps.querySelectorAll('[data-sz]')) {
      b.addEventListener('click', () => {
        const id = Number(b.dataset.sz);
        if (arcOuvertesSz.has(id)) arcOuvertesSz.delete(id);
        else arcOuvertesSz.add(id);
        dessinerArchi();
      });
    }
  }

  // LE FILTRE PORTE SUR LA COLONNE VISEE quand il y en a une, sur le groupe
  // sinon. « Manquants » ne veut pas dire la meme chose pour un personnage et
  // pour l'equipe, et c'est justement la question qu'on se pose en cliquant le
  // bouton d'une ligne.
  function gardeLigne(ligne) {
    if (arcFiltre === 'tous') return true;
    const a = arcVise === null
      ? ligne.presents.length > 0
      : ligne.presents.includes(arcVise);
    return arcFiltre === 'possedes' ? a : !a;
  }

  function dessinerArchi() {
    const corps = document.getElementById('arcCorps');
    const pied = document.getElementById('arcPied');
    const vise = document.getElementById('arcVise');
    if (arcTable === null) { corps.textContent = ''; pied.textContent = ''; return; }

    const comptes = arcTable.comptes;
    const nomVise = (comptes.find((c) => c.pid === arcVise) || {}).nom;
    vise.textContent = nomVise ? 'colonne suivie : ' + nomVise : '';

    for (const b of document.querySelectorAll('.arc-filtres button')) {
      if (b.dataset.quoi) b.classList.toggle('on', b.dataset.quoi === arcQuoi);
      else if (b.dataset.vue) b.classList.toggle('on', b.dataset.vue === arcVue);
      else b.classList.toggle('on', b.dataset.filtre === arcFiltre);
    }
    document.getElementById('arcTitre').textContent = arcTable.titre || 'Archimonstres';
    // LES FILTRES NE VALENT QUE POUR LA LISTE, et ils disparaissent ailleurs.
    // Les griser les laissait visibles, donc promettait encore un geste.
    document.getElementById('arcFiltresListe').hidden = arcVue !== 'liste';

    if (arcVue === 'zones') { dessinerZones(corps); dessinerPied(pied); return; }

    const enTete = ['<th class="' + ARC.gauche + '">Archimonstre</th>', '<th>Niv</th>']
      .concat(comptes.map((c) => '<th class="'
        + classesDe(c.pid === arcVise && ARC.visee) + '">' + echapper(c.nom) + '</th>'))
      .join('');

    const lignes = arcTable.lignes.filter(gardeLigne);
    const corpsHtml = lignes.map((l) => '<tr><td>' + echapper(l.nom) + '</td>'
      + '<td class="' + ARC.niv + '">' + l.niveau + '</td>'
      + comptes.map((c) => {
        const a = l.presents.includes(c.pid);
        return '<td class="' + classesDe(ARC.cellule, a && ARC.presente,
          c.pid === arcVise && ARC.visee) + '">' + (a ? '✔' : '·') + '</td>';
      }).join('') + '</tr>').join('');

    // UN TABLEAU VIDE DOIT LE DIRE. Sans cette ligne, « aucun manquant » et
    // « le tableau ne s'est pas construit » ont exactement la meme allure.
    const vide = '<tr class="' + ARC.vide + '"><td colspan="' + (comptes.length + 2) + '">'
      + (comptes.length === 0
        ? 'aucun personnage connecté'
        : 'rien à afficher avec ce filtre') + '</td></tr>';

    corps.innerHTML = '<table class="arc-table"><thead><tr>' + enTete + '</tr></thead>'
      + '<tbody>' + (corpsHtml || vide) + '</tbody></table>';

    dessinerPied(pied);
  }

  function dessinerPied(pied) {
    const comptes = arcTable.comptes;
    // Le pied dit ce que le groupe possede, puis chaque personnage. Un
    // inventaire pas encore lu y reste un tiret, jamais un zero.
    // `horsTableau`, ce sont les ames de BOSS: une pierre en capture aussi, et
    // trois des 143 ames mesurees le 04/09 en etaient. Les taire ferait un
    // compte qui ne tombe pas juste; les compter dans le tableau inventerait
    // des lignes qui n'existent pas.
    const parCompte = comptes.map((c) => '<span>' + (c.lu
      ? echapper(c.nom) + ' <b>' + c.possede + '</b>'
        + (c.horsTableau > 0 ? ' (+' + c.horsTableau + ' hors tableau)' : '')
      : echapper(c.nom) + ' <b>—</b>') + '</span>').join('');
    pied.innerHTML = '<span>' + arcTable.total + ' archimonstres</span>'
      + '<span>possédés <b>' + arcTable.possedes + '</b></span>'
      + '<span>manquants <b>' + arcTable.manquants + '</b></span>'
      + parCompte;
  }

  // LE DELAI N'EST PAS UN PARI. `itr` a ete mesuree le 01/09: le serveur repond
  // par un `ivx` en 38 ms, trois fois sur trois. Dix fois cette mesure laisse
  // toute la place, et reste imperceptible a la main.
  const DELAI_RELECTURE_MS = 400;

  // REDEMANDER, PUIS RELIRE, ET DANS CET ORDRE. Demander sans relire ne
  // montrerait rien; relire sans demander relirait l'ancien.
  //
  // La reponse n'arrive PAS par ce chemin: le `ivx` revient par l'ecoute
  // ordinaire et alimente la collection cote main.js. Ici on attend, puis on
  // redemande le tableau -- c'est pour ca qu'il y a un delai plutot qu'une
  // promesse a attendre.
  async function relireArchi() {
    const bouton = document.getElementById('arcRelire');
    const avis = document.getElementById('arcAvis');
    bouton.disabled = true;
    avis.textContent = 'demande envoyée…';
    try {
      const r = await window.app.archiRelire();
      if (!r || r.demandes === 0) {
        avis.textContent = 'aucun personnage à interroger';
        return;
      }
      await new Promise((f) => setTimeout(f, DELAI_RELECTURE_MS));
      arcTable = await window.app.tableauArchi(arcVise, arcQuoi);
      dessinerArchi();
      // Le compte des demandes PARTIES, pas des reponses: on ne sait pas ici ce
      // qui est revenu, et l'annoncer serait une promesse invention.
      avis.textContent = r.demandes === r.total
        ? r.demandes + ' inventaire(s) redemandé(s)'
        : r.demandes + ' inventaire(s) sur ' + r.total + ' — les autres n’ont pas répondu';
    } catch (e) {
      // Meme regle que l'ouverture: un bouton qui ne fait rien est le pire des
      // echecs. Il dit ce qui a casse plutot que de se rallumer en silence.
      avis.textContent = 'échec : ' + (e && e.message ? e.message : String(e));
    } finally {
      bouton.disabled = false;
    }
  }

  document.getElementById('arcRelire').onclick = relireArchi;
  document.getElementById('arcFermer').onclick = fermerArchi;
  for (const b of document.querySelectorAll('.arc-filtres button')) {
    b.addEventListener('click', async () => {
      // CHANGER DE COLLECTION DEMANDE UNE NOUVELLE TABLE: c'est le process
      // principal qui croise les ames avec la liste de reference. Changer de
      // vue, lui, ne fait que redessiner ce qu'on a deja -- la vue par zone
      // voyage dans le meme aller-retour.
      if (b.dataset.quoi) {
        if (b.dataset.quoi === arcQuoi) return;
        arcQuoi = b.dataset.quoi;
        arcOuvertes.clear();
        arcOuvertesSz.clear();
        arcTable = await window.app.tableauArchi(arcVise, arcQuoi);
        dessinerArchi();
        return;
      }
      if (b.dataset.vue) arcVue = b.dataset.vue;
      else arcFiltre = b.dataset.filtre;
      dessinerArchi();
    });
  }

  // Une seule saisie a la fois. Échap annule sans rien changer.
  let ecoute = null;
  window.addEventListener('keydown', (e) => {
    // Echap ferme le devlog — mais seulement si aucune saisie de touche n'est
    // en cours: pendant une saisie, Echap doit garder son sens d'annulation.
    if (e.key === 'Escape' && ecoute === null && !document.getElementById('quoiDeNeuf').hidden) {
      fermerQuoiDeNeuf();
      return;
    }
    if (e.key === 'Escape' && ecoute === null && !document.getElementById('vueArchi').hidden) {
      fermerArchi();
      return;
    }
    if (ecoute === null) return;
    e.preventDefault();
    const cible = ecoute;
    if (e.key === 'Escape') { ecoute = null; cible.annuler(); return; }
    const a = accelerateurDe(e);
    if (a === null) return;   // modificateur seul: on attend la vraie touche
    ecoute = null;
    cible.poser(a);
  });

  // La saisie accepte un bouton de souris comme une touche. Le clic gauche
  // est exclu par BOUTONS: c'est lui qui arme la saisie.
  window.addEventListener('mousedown', (e) => {
    const a = accelerateurSourisDe(e);
    if (a === null) return;
    // M4 et M5 sont « precedent » et « suivant » pour Chromium.
    e.preventDefault();
    if (ecoute !== null) {
      const cible = ecoute;
      ecoute = null;
      cible.poser(a);
      return;
    }
    // Hors saisie, l'appui vaut raccourci: c'est le cas ou la fenetre d'OMNI
    // a le focus, que l'agent ne voit pas.
    window.app.boutonSouris({
      button: e.button, ctrlKey: e.ctrlKey, altKey: e.altKey, shiftKey: e.shiftKey,
    });
  });

  // LE RETOUR A L'ETAT NORMAL EST FAIT ICI, pour les deux issues.
  //
  // Il etait a la charge de l'appelant, qui ne le faisait que dans le chemin
  // d'annulation: apres une frappe, la classe `ecoute` restait posee. Or la
  // mise a jour d'un rang saute volontairement le cabochon tant qu'elle est la,
  // pour ne pas effacer le « frappe… » sous les doigts de l'utilisateur. Le
  // bouton restait donc fige sur « frappe… » pour toujours, et n'affichait
  // jamais la touche — pourtant bien enregistree.
  //
  // L'appelant ne fournit plus que `poser`. Le libelle definitif viendra de
  // l'etat suivant, comme pour tout le reste du panneau.
  function armerSaisie(bouton, poser) {
    // Sans ceci, armer un cabochon puis en cliquer un autre laisse le
    // premier fige sur "frappe ou clique..." pour toujours: la mise a jour
    // d'un rang saute volontairement tout cabochon marque `ecoute`.
    if (ecoute !== null) { const precedente = ecoute; ecoute = null; precedente.annuler(); }
    const avant = bouton.textContent;
    bouton.classList.add('ecoute');
    bouton.textContent = 'frappe ou clique…';
    const rendre = () => {
      bouton.classList.remove('ecoute');
      bouton.textContent = avant;
    };
    ecoute = {
      poser: (a) => { rendre(); poser(a); },
      annuler: rendre,
    };
  }

  // On ne propose la bascule que pour un client reellement pilote: l'agent est
  // ce qui met la fenetre au premier plan, et sans lui le clic ne ferait rien.
  const utilisableBascule = (l) => l.id !== null && l.pilotable;

  // L'embleme s'il est deja en cache, l'abreviation de la classe sinon. Jamais
  // d'image cassee: un ami hors ligne garde une interface lisible, et
  // l'embleme apparaitra au premier lancement connecte.
  function dansLaPlaque(ligne) {
    if (ligne.embleme) {
      return '<img src="' + ligne.embleme + '" alt="' + (ligne.classe || '') + '">';
    }
    if (!ligne.classe) return '<span></span>';
    const court = ligne.classe.length <= 4 ? ligne.classe : ligne.classe.slice(0, 3);
    return '<span>' + court + '</span>';
  }

  document.getElementById('reduire').addEventListener('click', () => window.app.fenetreReduire());
  document.getElementById('fermer').addEventListener('click', () => window.app.fenetreFermer());

  // L'interrupteur unique. Il n'ecrit rien lui-meme: il demande, et l'etat
  // suivant fait foi — comme toutes les commandes de ce panneau.
  const interActif = document.getElementById('interActif');
  interActif.addEventListener('click', () => {
    window.app.basculerActif(!interActif.classList.contains('on'));
  });

  // L'interrupteur de la chasse a l'archimonstre. Meme regle: il demande, et
  // l'etat suivant fait foi.
  const interPdaArchi = document.getElementById('interPdaArchi');
  interPdaArchi.addEventListener('click', () => {
    window.app.pdaArchiArmer(!interPdaArchi.classList.contains('on'));
  });

  // LE BIP DE LA CHASSE, le premier son d'OMNI.
  //
  // Deux notes basses, distinctes de tout ce que fait Dofus. SYNTHETISEES
  // plutot que jouees depuis un fichier: rien a embarquer dans le paquet, donc
  // rien a oublier dans FICHIERS_DESKTOP de outils/faire-etape.js -- l'oubli
  // silencieux qui a failli couter l'overlay.
  let audio = null;
  function bip() {
    try {
      if (audio === null) audio = new AudioContext();
      if (audio.state === 'suspended') audio.resume();
      const debut = audio.currentTime;
      for (const [rang, hz] of [[0, 330], [1, 247]]) {
        const t = debut + rang * 0.22;
        const o = audio.createOscillator();
        const g = audio.createGain();
        o.type = 'sine';
        o.frequency.value = hz;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
        o.connect(g).connect(audio.destination);
        o.start(t);
        o.stop(t + 0.2);
      }
    } catch (e) {
      // Pas de son disponible: le texte sur la ligne du compte suffit.
    }
  }

  // UN SEUL BIP, meme si les quatre comptes sont en defaut au meme combat:
  // quatre bips superposes ne disent rien de plus qu'un seul. Le detail par
  // compte est deja sur sa ligne.
  let dernierBip = 0;
  window.app.surPdaArchiAlerte(() => {
    const t = Date.now();
    if (t - dernierBip > 3000) { bip(); dernierBip = t; }
  });

  // Les memes regles que src/comptes/colonnes.js, cote affichage. Le module
  // n'est pas importable ici (le renderer est sandboxe), il reste la reference,
  // et main.js recalcule la cible de son cote avant d'ecrire.
  // `droit`: la fonction verrouillable que cette colonne commande, ou null si
  // elle n en commande aucune (repl est l outil lui-meme, jamais verrouillable).
  const COLONNES = {
    repl: { champ: 'exclu', inverse: true, droit: null },
    tour: { champ: 'passeTour', inverse: false, droit: 'passe-tour' },
    groupe: { champ: 'invitation', inverse: false, droit: 'invitation' },
    anim: { champ: 'noAnim', inverse: false, droit: 'no-anim' },
    echange: { champ: 'echange', inverse: false, droit: 'echange' },
  };

  const valeurDe = (l, nom) => {
    const c = COLONNES[nom];
    return c.inverse ? !l[c.champ] : Boolean(l[c.champ]);
  };

  // Seules les lignes portant un identifiant comptent: sans lui rien ne
  // s'enregistre, donc la ligne ne participe ni a l'etat ni a l'action.
  const pertinentes = (lignes) => lignes.filter((l) => l.id !== null && l.id !== undefined);

  function etatColonne(lignes, nom) {
    const utiles = pertinentes(lignes);
    if (utiles.length === 0) return 'aucun';
    const coches = utiles.filter((l) => valeurDe(l, nom)).length;
    if (coches === 0) return 'aucun';
    return coches === utiles.length ? 'tous' : 'partiel';
  }

  let dernieresLignes = [];
  // Ce que cette cle a le droit d utiliser, tel que le processus principal
  // vient de le dire. Lue par majRang(), qui ne recoit pas l etat.
  let droitsCourants = [];
  for (const b of document.querySelectorAll('[data-colonne]')) {
    b.addEventListener('click', () => {
      const ids = pertinentes(dernieresLignes).map((l) => l.id);
      if (ids.length) window.app.basculerColonne(b.dataset.colonne, ids);
    });
  }

  document.getElementById('delai').addEventListener('change', (e) => {
    window.app.reglerDelai(e.target.value);
  });

  // Confirmation en place plutot qu'une fenetre modale: un clic de travers
  // fermerait tous les clients, potentiellement en plein combat. Le premier
  // clic arme, le second ferme, et l'armement retombe seul.
  let offArme = null;
  document.getElementById('boff').addEventListener('click', () => {
    const b = document.getElementById('boff');
    if (offArme !== null) {
      clearTimeout(offArme);
      offArme = null;
      b.classList.remove('confirme');
      b.textContent = 'Fermer les clients';
      window.app.fermerTousLesClients();
      return;
    }
    b.classList.add('confirme');
    b.textContent = 'Confirmer ?';
    offArme = setTimeout(() => {
      offArme = null;
      b.classList.remove('confirme');
      b.textContent = 'Fermer les clients';
    }, 3000);
  });

  // Un clic hors d'un menu HDV le referme. Sans cela le menu reste ouvert
  // pendant qu'on agit ailleurs, et il recouvre la ligne suivante.
  document.addEventListener('click', () => {
    for (const m of document.querySelectorAll('.menu-hdv')) m.hidden = true;
  });

  document.getElementById('boverlay').addEventListener('click', () => {
    window.app.basculerOverlay();
  });

  // ==========================================================================
  // LE RENDU NE DETRUIT PLUS RIEN.
  //
  // La liste etait videe puis recreee a chaque etat, soit toutes les deux
  // secondes. Un bouton detruit entre l'enfoncement et le relachement de la
  // souris ne produit AUCUN clic: le geste se perdait au hasard du tick, et
  // c'est ce qui donnait l'impression que les boutons « ne validaient pas ».
  //
  // Chaque rang est donc cree UNE FOIS puis mis a jour sur place. Ses ecouteurs
  // sont poses a la creation et ne bougent plus: ils lisent r.ligne, que la
  // mise a jour reecrit. Aucun noeud interactif n'est jamais remplace.
  // ==========================================================================

  const rangs = new Map();   // cle stable -> le rang et ses parties

  // L'identifiant de compte quand il existe, le pid sinon: un client dont la
  // ligne de commande ne porte pas de -logFile n'a que lui.
  const cleDe = (l) => (l.id === null || l.id === undefined ? 'pid:' + l.pid : 'id:' + l.id);

  // `droit`: la fonction verrouillable que cette case commande, ou null si
  // elle n en commande aucune (repl est l outil lui-meme, jamais verrouillable).
  const CASES = [
    { champ: 'exclu', inverse: true, droit: null, envoyer: (l, v) => window.app.exclureCompte(l.id, !v) },
    { champ: 'passeTour', inverse: false, droit: 'passe-tour', envoyer: (l, v) => window.app.basculerPasseTourCompte(l.id, v) },
    { champ: 'invitation', inverse: false, droit: 'invitation', envoyer: (l, v) => window.app.basculerInvitationCompte(l.id, v) },
    { champ: 'noAnim', inverse: false, droit: 'no-anim', envoyer: (l, v) => window.app.basculerNoAnimCompte(l.id, v) },
    { champ: 'echange', inverse: false, droit: 'echange', envoyer: (l, v) => window.app.basculerEchangeCompte(l.id, v) },
  ];

  const valeurCase = (l, c) => (c.inverse ? !l[c.champ] : Boolean(l[c.champ]));

  function creerRang() {
    const r = { ligne: null };

    r.el = document.createElement('div');
    r.el.className = 'rang';

    r.portrait = document.createElement('div');
    r.nom = document.createElement('div');

    // L'identite bascule sur la fenetre du personnage: c'est le geste le plus
    // frequent en multicompte, il merite la plus grande cible du rang.
    const aller = () => {
      const l = r.ligne;
      if (l && l.id !== null && l.pilotable) window.app.basculerVersCompte(l.id);
    };
    r.portrait.addEventListener('click', aller);
    r.nom.addEventListener('click', aller);

    r.el.append(r.portrait, r.nom);

    r.celluleTouche = document.createElement('div');
    r.celluleTouche.className = 'cellule-touche';
    r.cabochon = document.createElement('button');
    r.cabochon.className = 'cabochon';
    r.cabochon.addEventListener('click', () => {
      const l = r.ligne;
      if (!l || l.id === null) return;
      armerSaisie(r.cabochon, (a) => window.app.reglerTouche(l.id, a));
    });
    // La corbeille retire le raccourci. Elle ne parait que s il y en a un:
    // un bouton qui n aurait rien a supprimer serait une promesse vide.
    r.oter = document.createElement('button');
    r.oter.className = 'oter';
    r.oter.title = 'retirer ce raccourci';
    r.oter.innerHTML = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" '
      + 'stroke-width="1.5" stroke-linecap="round"><path d="M2.5 3.5h9"/>'
      + '<path d="M5.5 3.5V2.2h3v1.3"/><path d="M3.6 3.5l.6 8.3h5.6l.6-8.3"/>'
      + '<path d="M5.9 5.8v3.7M8.1 5.8v3.7"/></svg>';
    r.oter.addEventListener('click', () => {
      const l = r.ligne;
      if (!l || l.id === null) return;
      window.app.reglerTouche(l.id, null);
    });

    r.celluleTouche.append(r.cabochon, r.oter);
    r.el.append(r.celluleTouche);

    r.cases = CASES.map((c) => {
      const b = document.createElement('button');
      b.className = 'case';
      b.innerHTML = '<span class="los"></span>';
      b.addEventListener('click', () => {
        const l = r.ligne;
        if (!l || l.id === null) return;
        c.envoyer(l, !valeurCase(l, c));
      });
      r.el.append(b);
      return b;
    });

    // Une seule cellule a droite, dont le CONTENU change: bouton ou verdict.
    // Les montrer a tour de role en detruisant celui qui ne sert pas
    // ramenerait exactement le probleme qu'on vient de supprimer.
    r.droite = document.createElement('div');
    r.boutonCommande = document.createElement('button');
    r.boutonCommande.className = 'bouton-commande';
    r.boutonCommande.addEventListener('click', () => {
      const l = r.ligne;
      if (!l || !l.eligibleMaitre) return;
      window.app.definirMaitre(l.estMaitre ? null : l.id);
    });
    r.verdict = document.createElement('span');
    r.verdict.className = 'verdict';
    r.droite.append(r.boutonCommande, r.verdict);
    r.el.append(r.droite);

    // LE MENU HDV DE CETTE LIGNE.
    //
    // Deux entrees: la mise a jour des prix et la mise en vente, chacune
    // inerte tant que son stock n'est pas connu. Cacher une entree inerte
    // ferait croire qu'elle n'est pas prevue.
    r.hdv = document.createElement('button');
    r.hdv.className = 'hdv';
    r.hdv.textContent = 'HDV';
    r.menuHdv = document.createElement('div');
    r.menuHdv.className = 'menu-hdv';
    r.menuHdv.hidden = true;
    r.majPrix = document.createElement('button');
    r.vente = document.createElement('button');
    r.menuHdv.append(r.majPrix, r.vente);

    // Un seul menu ouvert a la fois: deux menus superposes se recouvrent, et on
    // ne sait plus lequel repond au clic.
    r.hdv.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const etaitOuvert = !r.menuHdv.hidden;
      for (const m of document.querySelectorAll('.menu-hdv')) m.hidden = true;
      r.menuHdv.hidden = etaitOuvert;
    });
    r.majPrix.addEventListener('click', () => {
      const l = r.ligne;
      r.menuHdv.hidden = true;
      if (!l || l.pid === null || l.pid === undefined) return;
      // Sans lots connus il n'y a rien a mettre a jour, et sans le droit rien
      // a demander: l'entree est inerte dans les deux cas, et le clic ne doit
      // pas partir quand meme. La vraie garde reste celle de main.js.
      if (!droitsCourants.includes('hdv')) return;
      if (!l.hdvEnCours && !l.hdvLots) return;
      window.app.majPrixHdv(l.pid);
    });
    r.vente.addEventListener('click', () => {
      const l = r.ligne;
      r.menuHdv.hidden = true;
      if (!l || l.pid === null || l.pid === undefined) return;
      // Sans stock connu il n'y a rien a vendre, et sans le droit rien a
      // demander: l'entree est inerte dans les deux cas, et le clic ne doit
      // pas partir quand meme. La vraie garde reste celle de main.js.
      if (!droitsCourants.includes('vente')) return;
      if (!l.hdvVenteEnCours && !l.hdvPiles) return;
      window.app.mettreEnVenteHdv(l.pid);
    });
    r.el.append(r.hdv, r.menuHdv);

    // LE BOUTON ARCHI DE CETTE LIGNE. Il porte le compte de ce personnage et
    // ouvre le tableau sur sa colonne. Il n'envoie AUCUN ordre au jeu: OMNI a
    // deja tout ce qu'il faut, l'inventaire etant arrive seul a la connexion.
    r.archi = document.createElement('button');
    r.archi.className = 'archi';
    r.archi.addEventListener('click', () => {
      const l = r.ligne;
      if (!l || l.pid === null || l.pid === undefined) return;
      ouvrirArchi(l.pid);
    });
    r.el.append(r.archi);

    // Le pouvoir de coupure de CE client. Premier clic arme, second ferme, et
    // l armement retombe seul: meme regle que le bouton qui les ferme tous.
    r.fermerUn = document.createElement('button');
    r.fermerUn.className = 'fermer-un';
    r.fermerUn.innerHTML = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" '
      + 'stroke-width="1.6" stroke-linecap="round"><path d="M7 2.4v4.4"/>'
      + '<path d="M10.5 3.9a4.6 4.6 0 1 1-7 0"/></svg>';
    let armeFermeture = null;
    const desarmer = () => {
      if (armeFermeture !== null) clearTimeout(armeFermeture);
      armeFermeture = null;
      r.fermerUn.classList.remove('confirme');
      r.fermerUn.title = 'fermer ce client';
    };
    r.fermerUn.addEventListener('click', () => {
      const l = r.ligne;
      if (!l || l.id === null) return;
      if (armeFermeture !== null) {
        desarmer();
        window.app.fermerUnClient(l.id);
        return;
      }
      r.fermerUn.classList.add('confirme');
      r.fermerUn.title = 'cliquer à nouveau pour fermer';
      armeFermeture = setTimeout(desarmer, 3000);
    });
    r.el.append(r.fermerUn);

    r.motif = document.createElement('div');
    r.motif.className = 'motif';
    r.el.append(r.motif);

    return r;
  }

  function majRang(r, l) {
    r.ligne = l;

    const alerte = l.etat === 'non-intercepte' || l.etat === 'erreur';
    r.el.className = 'rang'
      + (l.etat === 'hors-ligne' ? ' hors-ligne' : '')
      + (alerte ? ' alerte' : '')
      + (l.estMaitre ? ' commande' : '');

    const pilotable = l.id !== null && l.pilotable;
    r.portrait.className = pilotable ? 'zone-clic' : '';
    r.portrait.innerHTML = '<span class="plaque" title="'
      + (l.classe || 'classe inconnue, personnage pas encore en jeu')
      + '">' + dansLaPlaque(l) + '</span>';

    const principal = l.personnage || l.nickname;
    const second = l.personnage ? l.nickname : 'pas encore en jeu';
    r.nom.className = pilotable ? 'zone-clic' : '';
    r.nom.innerHTML = '<div class="nom">' + principal + '</div>'
      + '<div class="sous-nom' + (l.personnage ? '' : ' absent') + '">' + second + '</div>';
    r.nom.title = (l.personnage ? l.personnage + ' · ' + l.nickname : l.nickname)
      + (pilotable ? ' (cliquer pour passer sur cette fenêtre)' : '');

    // Le cabochon ne se reecrit pas pendant une saisie de touche, sinon le
    // « frappe… » disparaitrait sous les doigts de l'utilisateur.
    if (!r.cabochon.classList.contains('ecoute')) {
      const raison = risqueDe(l.touche);
      r.cabochon.className = 'cabochon'
        + (l.touche ? '' : ' sans-touche')
        + (raison ? ' risque' : '');
      r.cabochon.textContent = l.touche ? libelleTouche(l.touche) : 'aucune';
      r.cabochon.disabled = l.id === null;
      r.cabochon.title = raison || 'Cliquer puis frapper une touche ou un bouton de souris. Échap annule.';
    }
    r.oter.hidden = !l.touche;

    r.cases.forEach((b, i) => {
      const actif = valeurCase(l, CASES[i]);
      // Une case dont le droit n est pas accorde reste cliquable sans ca: la
      // porte bloquerait bien la trame plus loin, mais en silence -- ni le
      // clic ni favoris.json ne diraient pourquoi rien ne se passe.
      const bloque = CASES[i].droit && !droitsCourants.includes(CASES[i].droit);
      b.classList.toggle('on', actif);
      b.disabled = !pilotable || bloque;
      b.setAttribute('aria-pressed', String(actif));
      b.title = bloque ? 'pas activé sur ta clé' : '';
    });

    // A DROITE: le bouton OU le verdict, jamais les deux. Un compte non
    // eligible ne peut pas commander, et lui proposer le geste serait la
    // promesse d'un role qu'il ne peut pas tenir.
    if (l.eligibleMaitre) {
      r.boutonCommande.hidden = false;
      r.verdict.hidden = true;
      r.boutonCommande.classList.toggle('on', l.estMaitre);
      r.boutonCommande.textContent = l.estMaitre ? 'Commande' : 'Désigner';
      r.boutonCommande.title = l.estMaitre
        ? 'ce compte commande — cliquer pour ne plus avoir de meneur'
        : 'faire commander ce compte';
    } else {
      r.boutonCommande.hidden = true;
      r.verdict.hidden = false;
      r.verdict.className = 'verdict ' + (FORME[l.etat] || 'calme');
      r.verdict.innerHTML = '<span class="los"></span>' + (LIBELLE[l.etat] || l.etat);
    }

    // Un compte hors ligne n a pas de fenetre a fermer: le bouton serait la
    // promesse d un geste sans effet.
    const aUneFenetre = l.id !== null && l.pid !== null && l.pid !== undefined && l.etat !== 'hors-ligne';
    r.fermerUn.disabled = !aUneFenetre;
    if (!aUneFenetre) r.fermerUn.classList.remove('confirme');
    if (!r.fermerUn.title) r.fermerUn.title = 'fermer ce client';

    // LE COMPTE D'ARCHIMONSTRES. `null` veut dire « inventaire pas encore lu »,
    // et il s'affiche `—`: un zero le ferait passer pour un personnage sans une
    // seule ame, alors qu'on n'en sait rien. C'est la lecon du 03/09, un
    // silence qui ressemble a une reponse.
    const archiLu = l.archi !== null && l.archi !== undefined;
    r.archi.textContent = archiLu ? String(l.archi) : '—';
    r.archi.disabled = !archiLu;
    r.archi.classList.toggle('pleine', archiLu && l.archi > 0);
    r.archi.title = archiLu
      ? l.archi + ' archimonstre(s) en inventaire — ouvrir le tableau'
      : 'inventaire pas encore lu : ce client a-t-il été lancé après OMNI ?';

    // Le menu n'a de sens que sur un client en jeu, et seulement si la cle a
    // AU MOINS UN des deux droits: ses deux entrees se verrouillent
    // separement. `hdvLots` a zero veut dire que kby n'est jamais passee.
    const droitHdv = droitsCourants.includes('hdv');
    const droitVente = droitsCourants.includes('vente');
    const enJeu = l.pid !== null && l.pid !== undefined && l.etat !== 'hors-ligne';
    const hdvPossible = (droitHdv || droitVente) && enJeu;
    r.hdv.disabled = !hdvPossible;
    if (!hdvPossible) r.menuHdv.hidden = true;
    r.hdv.classList.toggle('tourne', Boolean(l.hdvEnCours || l.hdvVenteEnCours));
    r.hdv.title = !droitHdv && !droitVente
      ? 'pas activé sur ta clé'
      : l.hdvEnCours ? 'une mise à jour des prix est en cours'
      : l.hdvVenteEnCours ? 'une mise en vente est en cours' : 'hôtel de vente';
    // Chaque entree sous son propre droit, inerte plutot que cachee -- meme
    // raison qu'au stock inconnu: une entree absente ferait croire qu'elle
    // n'est pas prevue, alors qu'elle est seulement pas accordee.
    if (!droitHdv) {
      r.majPrix.textContent = 'Mettre à jour — pas activé sur ta clé';
      r.majPrix.classList.add('inerte');
    } else if (l.hdvEnCours) {
      r.majPrix.textContent = 'Arrêter la mise à jour';
      r.majPrix.classList.remove('inerte');
    } else if (l.hdvLots) {
      r.majPrix.textContent = 'Mettre à jour les prix (' + l.hdvLots + ' lots)';
      r.majPrix.classList.remove('inerte');
    } else {
      r.majPrix.textContent = 'Mettre à jour — ouvre l’HDV une fois';
      r.majPrix.classList.add('inerte');
    }
    if (!droitVente) {
      r.vente.textContent = 'Mettre en vente — pas activé sur ta clé';
      r.vente.classList.add('inerte');
    } else if (l.hdvVenteEnCours) {
      r.vente.textContent = 'Arrêter la mise en vente';
      r.vente.classList.remove('inerte');
    } else if (l.hdvPiles) {
      r.vente.textContent = 'Mettre en vente (' + l.hdvPiles + ' piles)';
      r.vente.classList.remove('inerte');
    } else {
      r.vente.textContent = 'Mettre en vente — ouvre l’HDV une fois';
      r.vente.classList.add('inerte');
    }

    r.motif.hidden = !l.message;
    r.motif.textContent = l.message || '';
  }

  window.app.surEtat((etat) => {
    droitsCourants = etat.droits || [];
    dernieresLignes = etat.lignes;

    interActif.classList.toggle('on', etat.actif);
    document.getElementById('libelleActif').textContent = etat.actif ? 'actif' : 'au repos';
    interActif.title = etat.actif
      ? 'OMNI agit. Cliquer pour tout suspendre sans rien effacer.'
      : 'OMNI est suspendu. Les réglages par compte sont conservés.';

    interPdaArchi.classList.toggle('on', etat.pdaArchi === true);
    interPdaArchi.title = etat.pdaArchi === true
      ? 'La bonne pierre d’âme est équipée sur tous les comptes à chaque entrée en combat. Cliquer pour arrêter.'
      : 'Éteint. Allumé, des pierres d’âme se rempliraient sur des monstres ordinaires.';

    // Le losange de chaque titre de colonne: plein, creux, ou a moitie.
    for (const b of document.querySelectorAll('[data-colonne]')) {
      const nom = b.dataset.colonne;
      const e = etatColonne(etat.lignes, nom);
      const j = b.querySelector('.jauge');
      j.classList.toggle('tous', e === 'tous');
      j.classList.toggle('partiel', e === 'partiel');
      // Meme piege que les cases par compte: un titre de colonne sans droit
      // declenche quand meme basculerColonne() pour tout le monde, et la
      // porte l'avale en silence pour chacun.
      const bloque = COLONNES[nom].droit && !droitsCourants.includes(COLONNES[nom].droit);
      b.disabled = bloque;
      b.title = bloque ? 'pas activé sur ta clé'
        : e === 'tous' ? 'Actif pour tous — cliquer pour couper tout le monde'
        : e === 'aucun' ? 'Éteint partout — cliquer pour activer tout le monde'
        : 'Actif pour certains — cliquer pour activer tout le monde';
    }

    const enDouble = [...new Set(
      etat.lignes.map((l) => l.touche).filter(Boolean)
        .filter((t, i, tous) => tous.indexOf(t) !== i)
    )];
    document.getElementById('avertTouches').textContent = enDouble.length
      ? '⚠ ' + enDouble.map(libelleTouche).join(', ') + ' en double'
      : '';

    document.getElementById('avisNav').textContent = etat.avisBascule || '';

    const champDelai = document.getElementById('delai');
    if (document.activeElement !== champDelai) champDelai.value = etat.delai;

    // Le bouton dit ce qu'il VA faire, et son cyan dit ce qui est. Un bouton
    // « Overlay » qui reste identique ouverte ou fermee laisserait chercher
    // pourquoi le clic « ne fait rien » quand la barre est hors de l'ecran.
    const bov = document.getElementById('boverlay');
    bov.classList.toggle('ouvert', Boolean(etat.overlayOuvert));
    bov.textContent = etat.overlayOuvert ? 'Masquer l’overlay' : 'Overlay';
    const droitOverlay = droitsCourants.includes('overlay');
    bov.disabled = !droitOverlay;
    // Recalcule a chaque etat, pas seulement au retrait: sans ca, un droit
    // rendu apres coupure laisserait le titre bloque sur le refus perime.
    bov.title = droitOverlay ? 'la barre de pictos posée par-dessus le jeu' : 'pas activé sur ta clé';

    document.getElementById('erreur').textContent = etat.erreurComptes || '';
    document.getElementById('sansmaitre').textContent = etat.sansMaitre
      ? 'Aucun compte ne commande : rien ne se réplique. Désigne-en un ci-dessous.'
      : '';

    const enJeu = etat.lignes.filter((l) => l.suivi).length;
    // Le numero est un bouton a part: il ouvre le devlog. Le reste du texte
    // suit dans son propre span, sinon le rafraichissement de l'etat
    // ecraserait le bouton toutes les deux secondes.
    versionCourante = etat.version || 'dev';
    document.getElementById('versionBouton').textContent = versionCourante;
    document.getElementById('titreEtat').textContent =
      ' · ' + enJeu + ' compte' + (enJeu > 1 ? 's' : '') + ' en jeu';

    const liste = document.getElementById('liste');
    document.getElementById('listeVide').hidden = etat.lignes.length > 0;

    // Les rangs disparus s'en vont, les autres restent en place.
    const presentes = new Set(etat.lignes.map(cleDe));
    for (const [cle, r] of [...rangs]) {
      if (!presentes.has(cle)) { r.el.remove(); rangs.delete(cle); }
    }

    let precedent = null;
    for (const l of etat.lignes) {
      const cle = cleDe(l);
      let r = rangs.get(cle);
      if (r === undefined) { r = creerRang(); rangs.set(cle, r); }
      majRang(r, l);
      // Ne deplacer QUE si l'ordre a change: deplacer un noeud pendant un clic
      // peut l'annuler, et l'ordre ne bouge presque jamais.
      const attendu = precedent === null ? liste.firstChild : precedent.nextSibling;
      if (attendu !== r.el) liste.insertBefore(r.el, attendu);
      precedent = r.el;
    }
  });
</script>
