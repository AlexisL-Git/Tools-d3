<!doctype html>
<meta charset="utf-8">
<title>OMNI</title>
<style>
  /* Polices EMBARQUEES, jamais appelees en ligne: OMNI doit demarrer sans
     reseau. Voir desktop/polices/LISEZMOI.md pour les licences. */
  @font-face {
    font-family: 'Cal Sans';
    src: url('polices/cal-sans.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: 'Karla';
    src: url('polices/karla.woff2') format('woff2');
    font-weight: 200 800; font-style: normal; font-display: swap;
  }

  /* ============================================================
     ENCRE ET CYAN. Trois couleurs, trois roles, aucun recouvrement.

       cyan     #2FD4C4   ce qui est arme
       orange   #FF9F1C   qui commande
       rouge    #F2545B   anomalie et danger

     Aucune ne fait deux metiers, et c est la seule regle a tenir
     si la palette rebouge.

     Mesures sur le fond #0F1418, toutes au-dessus de leur seuil:

       texte              15,83:1   (seuil 7)
       texte attenue       7,00:1   (seuil 4,5)
       qui commande        9,02:1   (seuil 4,5)
       arme contre repos   4,83:1   (seuil 3)
       alerte              5,46:1   (seuil 3)
       filet                1,52:1   (seuil 1,5)

     L ECART ARME / AU REPOS EST CE QUI COMPTE LE PLUS ICI, parce
     que c est lui qui separe une case cochee d une case vide. Il
     vaut 4,83, la ou une palette rouge essayee avant tombait a
     3,10 — juste au-dessus du seuil, sans marge. Toute teinte plus
     sombre pour « arme » repasserait dessous.

     Orange et cyan sont a 1,11:1 l un de l autre, donc presque
     identiques en niveaux de gris. Ce qui les separe est leur
     TEINTE, a 140 degres d ecart — le plus grand qu on ait eu — et
     le fait qu ils ne se cotoient jamais sur un meme element.

     Rien ici ne repose de toute facon sur la seule couleur: la case
     est un losange PLEIN quand elle est armee et CREUX sinon, le
     commandement porte en plus un lisere, un cerclage et un
     degrade, et chaque anomalie est ecrite en toutes lettres.
     ============================================================ */
  :root {
    color-scheme: dark;
    --fond: #0F1418;
    --releve: #171E24;
    --filet: #2C3740;
    --bord: #3E4B56;
    --texte: #E8EEF2;
    --attenue: #93A1AC;
    --arme: #2FD4C4;
    --arme-encre: #061C19;
    --commande: #FF9F1C;
    --commande-encre: #211504;
    --alerte: #F2545B;
    --ui: Karla, "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  /* L attribut hidden doit gagner, TOUJOURS. Le navigateur le rend par
     display:none, mais une regle d auteur qui pose un display le bat: c est
     exactement ce qui affichait le bouton « designer » ET le verdict sur la
     meme ligne, le second gardant en prime un texte perime. */
  [hidden] { display: none !important; }
  /* Colonne en hauteur pleine: la liste prend ce qui reste, quels que soient
     les bandeaux d'avertissement au-dessus. Une hauteur calculee a la main
     faisait couper le bas des qu'un avis apparaissait. */
  body {
    margin: 0; background: var(--fond); color: var(--texte);
    font-family: var(--ui); font-size: 14px; line-height: 1.45;
    user-select: none; overflow: hidden;
    height: 100vh; display: flex; flex-direction: column;
  }
  .barre-titre, .bandeau, .avis { flex: none; }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--commande); outline-offset: 2px; }

  /* ---------------- barre de titre ----------------
     La fenetre est sans cadre systeme: cette bande le remplace. Elle porte le
     nom, l'etat, les trois boutons, et sert de zone de deplacement. */
  .barre-titre {
    display: flex; align-items: center; gap: 10px;
    padding-left: 15px; height: 38px;
    border-bottom: 1px solid var(--filet);
    -webkit-app-region: drag;
  }
  .titre-nom {
    /* Cal Sans n'a qu'une graisse: jamais de gras, il serait synthetique. */
    font-family: "Cal Sans", "Segoe UI", system-ui, sans-serif;
    font-weight: 400; font-size: 19px; line-height: 1; letter-spacing: .005em;
  }
  .titre-nom .o { color: var(--commande); }
  .titre-etat {
    font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--attenue); font-weight: 600;
  }

  /* LE `no-drag` N'EST PAS DECORATIF. `.barre-titre` est `-webkit-app-region:
     drag` : sans cette ligne, Windows avale le clic comme un deplacement de
     fenetre et le bouton ne fait RIEN, sans le moindre message. Meme raison
     que sur `.fenetre-boutons` et `.maitre-inter`. */
  .version-lien {
    -webkit-app-region: no-drag;
    background: transparent; border: 0; padding: 0;
    font: inherit; color: inherit; letter-spacing: inherit;
    text-transform: inherit; cursor: pointer;
    border-bottom: 1px dotted var(--bord);
  }
  .version-lien:hover { color: var(--texte); border-bottom-color: var(--arme); }

  /* LE SEUL SIGNAL DANS LA BARRE quand le depot a avance: le numero passe au
     cyan, comme tout ce qui est arme dans ce panneau. Pas de texte, pas de
     bouton: la barre porte deja le nom, l'interrupteur, la version et l'etat,
     et une ligne de plus n'y etait plus lisible. Le detail est dans le panneau
     que ce meme numero ouvre. */
  .version-lien.retard { color: var(--arme); border-bottom-color: var(--arme); }

  /* Un panneau DANS la fenetre, pas une fenetre modale: le depot s'y refuse
     deja (confirmation en place pour la fermeture d'un client). */
  .quoi-de-neuf {
    position: absolute; inset: 38px 0 0 0; z-index: 20;
    background: var(--fond); display: flex; flex-direction: column;
  }
  .qdn-tete {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 12px 12px 15px; border-bottom: 1px solid var(--filet);
  }
  .qdn-tete b { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
  .qdn-tete button {
    margin-left: auto; width: 30px; height: 30px;
    background: transparent; border: 0; color: var(--attenue);
    font-size: 15px; cursor: pointer;
  }
  .qdn-tete button:hover { color: var(--texte); }
  /* Le bloc de mise a jour, en tete du panneau et au-dessus des notes: c'est
     la seule chose du panneau sur laquelle on peut AGIR, elle passe devant ce
     qui ne fait que se lire. */
  .qdn-maj {
    margin: 12px 15px 4px; padding: 11px 13px;
    border: 1px solid var(--filet); border-radius: 6px;
    display: flex; align-items: center; gap: 12px;
  }
  .qdn-maj.retard { border-color: var(--arme); background: rgba(47,212,196,.08); }
  .qdn-maj .texte { flex: 1; min-width: 0; }
  .qdn-maj .quoi { display: block; font-weight: 600; }
  .qdn-maj.retard .quoi { color: var(--arme); }
  .qdn-maj .refs {
    display: block; color: var(--attenue); font-size: 12px;
    font-variant-numeric: tabular-nums;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .qdn-corps { overflow-y: auto; padding: 6px 15px 18px; }
  .qdn-version { padding: 12px 0; border-bottom: 1px solid var(--filet); }
  .qdn-version:last-child { border-bottom: 0; }
  .qdn-titre { display: flex; align-items: baseline; gap: 8px; }
  .qdn-titre b { font-size: 14px; }
  .qdn-titre .date { font-size: 11px; color: var(--attenue); }
  .qdn-titre .ici {
    font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--arme-encre); background: var(--arme);
    padding: 2px 6px; border-radius: 999px; font-weight: 700;
  }
  .qdn-version ul { margin: 7px 0 0; padding-left: 18px; }
  .qdn-version li { font-size: 13px; line-height: 1.5; margin-bottom: 3px; color: var(--texte); }
  .qdn-vide { padding: 30px 0; text-align: center; color: var(--attenue); font-size: 13.5px; }
  .fenetre-boutons { margin-left: auto; display: flex; -webkit-app-region: no-drag; }
  .fenetre-boutons button {
    width: 44px; height: 38px; display: grid; place-items: center;
    background: transparent; border: 0; color: var(--attenue);
  }
  .fenetre-boutons button:hover { background: rgba(255,255,255,.07); color: var(--texte); }
  .fenetre-boutons button.fermer:hover { background: var(--alerte); color: #fff; }
  .fenetre-boutons svg { width: 11px; height: 11px; }

  /* ---------------- l interrupteur unique ----------------
     Il a remplace cinq interrupteurs generaux, un par fonction. Ce modele
     avait deux niveaux que rien ne reliait a l ecran, et une case cochee sous
     un general eteint ne faisait rien sans que ca se voie.
     Celui-ci SUSPEND tout sans rien effacer. */
  .maitre-inter {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 5px 12px 5px 10px; border-radius: 999px;
    border: 1px solid var(--bord); background: var(--fond); color: var(--attenue);
    font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    -webkit-app-region: no-drag;
  }
  .maitre-inter .temoin {
    width: 9px; height: 9px; flex: none; transform: rotate(45deg); border-radius: 5px;
    border: 1.5px solid var(--bord); background: transparent;
  }
  .maitre-inter.on { color: var(--arme); border-color: var(--arme); }
  .maitre-inter.on .temoin {
    background: var(--arme); border-color: var(--arme);
    box-shadow: 0 0 8px rgba(47,212,196,.65);
  }
  .maitre-inter:hover { color: var(--texte); border-color: var(--attenue); }
  .maitre-inter.on:hover { color: var(--arme); filter: brightness(1.15); }


  .champ-delai {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--attenue); font-weight: 700;
  }
  .champ-delai input {
    width: 52px; padding: 4px 6px; font: inherit; font-size: 13px;
    background: var(--fond); color: var(--texte);
    border: 1px solid var(--bord); border-radius: 8px;
    font-variant-numeric: tabular-nums; text-transform: none; letter-spacing: 0;
  }
  .coupe {
    padding: 6px 13px; border-radius: 999px;
    border: 1px solid var(--alerte); background: transparent; color: var(--alerte);
    font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  }
  .coupe.confirme { background: var(--alerte); color: #1F0B0C; }

  /* Le bouton de l'overlay. Il n'est PAS `.coupe`: cette classe est rouge, et
     le rouge dit « anomalie » partout ailleurs dans le panneau. Ouvrir une
     fenetre ne detruit rien. Il passe au cyan quand elle est ouverte, comme
     tout ce qui est arme. */
  .pose {
    padding: 6px 13px; border-radius: 999px;
    border: 1px solid var(--bord); background: transparent; color: var(--attenue);
    font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  }
  .pose:hover:not(:disabled) { border-color: var(--attenue); color: var(--texte); }
  .pose.ouvert { border-color: var(--arme); color: var(--arme); }
  /* Sans cette regle le bouton reste visuellement actif une fois `disabled`
     pose par surEtat(): la regle generale `button { cursor: pointer; }` et
     les couleurs d'auteur ecrasent le style par defaut du navigateur. Meme
     traitement que .hdv:disabled plus bas. */
  .pose:disabled { opacity: .3; cursor: not-allowed; }

  .avis { padding: 9px 15px; font-size: 13px; border-bottom: 1px solid var(--filet); }
  .avis:empty { display: none; }
  #erreur { background: rgba(242,84,91,.14); color: var(--alerte); }
  #sansmaitre { background: rgba(255,159,28,.10); color: var(--commande); }

  /* Un raccourci se lit comme une touche de clavier: inscription creusee et
     relief. */
  .cabochon {
    display: block; width: 100%; padding: 5px 6px; border-radius: 8px;
    border: 1px solid var(--bord); background: var(--releve); color: var(--texte);
    font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-align: center;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.45); white-space: nowrap;
  }
  .cabochon:hover { border-color: var(--commande); color: var(--commande); }
  .cabochon.sans-touche { color: var(--filet); border-style: dashed; box-shadow: none; background: transparent; }
  .cabochon.ecoute { border-color: var(--commande); color: var(--commande); border-style: solid; background: rgba(255,159,28,.12); }
  /* Signale deux situations differentes, pas une seule: une touche NUE est
     CONFISQUEE a Dofus tant qu'OMNI tourne, alors qu'un clic molette est
     seulement PARTAGE avec lui (Dofus le recoit aussi). Signalee, pas
     interdite — c'est l'utilisateur qui sait ce qu'il utilise en combat. */
  .cabochon.risque { border-color: var(--alerte); color: var(--alerte); }

  .barre-nav {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 9px 15px; border-top: 1px solid var(--filet); background: var(--releve);
    font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--attenue); font-weight: 700;
  }
  /* La cellule Touche: le cabochon prend la place, la corbeille se glisse a
     cote et ne parait que si une touche est assignee. */
  .cellule-touche { display: flex; align-items: center; gap: 4px; }
  .cellule-touche .cabochon { flex: 1; min-width: 0; }
  .oter {
    flex: none; width: 22px; height: 26px; padding: 0;
    display: grid; place-items: center;
    background: transparent; border: 0; color: var(--filet);
    border-radius: 6px;
  }
  /* Fermer CE client. Deux clics, comme le bouton qui les ferme tous: la
     colonne est etroite, la souris passe dessus en visant la commande, et un
     clic de travers couterait une session — potentiellement en plein combat. */
  .fermer-un {
    width: 100%; height: 30px; padding: 0; display: grid; place-items: center;
    background: transparent; border: 0; color: var(--filet); border-radius: 8px;
  }
  .fermer-un:hover { color: var(--alerte); background: rgba(242,84,91,.12); }
  .fermer-un:disabled { opacity: .25; cursor: not-allowed; }
  .fermer-un.confirme {
    color: var(--alerte); background: rgba(242,84,91,.2);
    box-shadow: inset 0 0 0 1px var(--alerte);
  }
  .fermer-un svg { width: 13px; height: 13px; }

  /* Le menu HDV de la ligne. Il s'ouvre AU CLIC, pas au survol: un menu qui
     surgit en passant la souris se declenche pendant qu'on vise autre chose. */
  .hdv {
    width: 100%; height: 30px; padding: 0; border-radius: 8px;
    background: transparent; border: 1px solid var(--filet); color: var(--attenue);
    font-size: 10.5px; letter-spacing: .06em; font-weight: 700;
  }
  .hdv:hover:not(:disabled) { color: var(--texte); border-color: var(--accent); }
  .hdv:disabled { opacity: .3; cursor: not-allowed; }
  .hdv.tourne { color: var(--accent); border-color: var(--accent); }
  .menu-hdv {
    position: absolute; right: 46px; top: 34px; z-index: 5;
    background: var(--fond); border: 1px solid var(--filet); border-radius: 10px;
    padding: 4px; min-width: 210px; box-shadow: 0 8px 22px rgba(0,0,0,.45);
  }
  .menu-hdv button {
    display: block; width: 100%; text-align: left; padding: 7px 10px;
    background: transparent; border: 0; border-radius: 7px; color: var(--texte);
    font-size: 12px;
  }
  .menu-hdv button:hover { background: rgba(255,255,255,.06); }
  /* Une entree inerte reste VISIBLE. La cacher ferait croire qu'elle n'est pas
     prevue; grisee, elle dit qu'elle existe et pourquoi elle n'agit pas. */
  .menu-hdv button.inerte { color: var(--attenue); }

  /* ---------------- les archimonstres ---------------- */
  /* Le bouton de la ligne porte le COMPTE de ce personnage. Un tiret, et pas un
     zero, tant que son inventaire n'a pas ete lu: `ivx` n'arrive qu'a la
     connexion, donc un client lance avant OMNI n'en enverra jamais. */
  .archi {
    width: 100%; height: 30px; padding: 0; border-radius: 8px;
    background: transparent; border: 1px solid var(--filet); color: var(--attenue);
    font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .archi:hover:not(:disabled) { color: var(--texte); border-color: var(--accent); }
  .archi:disabled { opacity: .3; cursor: not-allowed; }
  .archi.pleine { color: var(--texte); }

  /* Meme forme que « Quoi de neuf »: un panneau DANS la fenetre. */
  .vue-archi {
    position: absolute; inset: 38px 0 0 0; z-index: 20;
    background: var(--fond); display: flex; flex-direction: column;
  }
  .arc-corps { flex: 1; overflow-y: auto; padding: 0 15px 14px; }
  /* `separate` ET PAS `collapse`, pour l'en-tete collant: avec les bordures
     fusionnees, celle de l'en-tete appartient au tableau et reste en haut de la
     page pendant que l'en-tete descend -- le filet se detache de sa ligne. */
  .arc-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
  .arc-table th {
    position: sticky; top: 0; z-index: 3; background: var(--fond);
    padding: 9px 6px; border-bottom: 1px solid var(--filet);
    font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--attenue); font-weight: 700; text-align: center;
  }
  .arc-table th.arc-gauche { text-align: left; }
  /* `display` EXPLICITE, et ce n'est pas superflu. Le 04/09, les cellules
     s'appelaient `case` -- un nom deja pris par le losange des cinq colonnes
     d'une ligne, qui porte `display: grid`. Les <td> sortaient de la mise en
     table et les quatre coches d'un archimonstre s'empilaient dans la premiere
     colonne. Les noms sont prefixes depuis, mais poser le display ici rend le
     tableau insensible a la prochaine collision, quelle qu'elle soit. */
  .arc-table td { display: table-cell; padding: 4px 6px; border-bottom: 1px solid rgba(255,255,255,.04); }
  .arc-table th { display: table-cell; }
  .arc-table td.arc-niv { text-align: right; color: var(--attenue); font-variant-numeric: tabular-nums; }
  .arc-table td.arc-case { text-align: center; color: var(--attenue); }
  .arc-table td.arc-case.arc-a { color: var(--arme); }
  /* La colonne du personnage dont on a clique le bouton. Le tableau montre
     tout le monde; ce n'est qu'un reperage, jamais un filtre cache.
     LE VOILE SE POSE EN PLUS DU FOND, JAMAIS A LA PLACE. Cette regle vient
     apres celle de l'en-tete: ecrite `background: rgba(...)`, elle REMPLACAIT
     `var(--fond)`, l'en-tete collant devenait translucide, et les coches lui
     passaient au travers pendant le defilement. Signale par Jibef le 04/09. */
  .arc-table th.arc-vise, .arc-table td.arc-vise {
    background: linear-gradient(rgba(255,255,255,.05), rgba(255,255,255,.05)), var(--fond);
  }
  .arc-table tr.arc-aucun td { color: var(--attenue); }
  .arc-filtres { display: flex; align-items: center; gap: 6px; padding: 10px 15px 8px; }
  .arc-filtres button {
    padding: 5px 11px; border-radius: 7px; background: transparent;
    border: 1px solid var(--filet); color: var(--attenue); font-size: 11.5px;
  }
  .arc-filtres button.on { color: var(--texte); border-color: var(--accent); }
  /* Le groupe des filtres, cache d'un bloc dans la vue par zone. Il garde le
     meme espacement que les boutons de vue a sa gauche. */
  .arc-filtres-liste { display: flex; gap: 6px; margin-left: 12px; }
  .arc-filtres-liste[hidden] { display: none; }
  /* La vue par zone. Toutes ses classes sont prefixees `arc-`, comme celles du
     tableau, et pour la meme raison: voir le commentaire de la table ARC. */
  .arc-zone, .arc-sz {
    display: flex; align-items: center; gap: 10px;
    width: 100%; text-align: left; background: transparent; border: 0;
    padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,.04);
    color: var(--texte); font-size: 13px;
  }
  .arc-zone:hover { background: rgba(255,255,255,.04); }
  .arc-sz { padding-left: 30px; font-size: 12.5px; color: var(--attenue); cursor: default; }
  .arc-fleche { width: 12px; color: var(--attenue); font-size: 10px; }
  .arc-nom { flex: 1; min-width: 0; }
  /* Le nombre est ce sur quoi on trie: il se lit en colonne, chiffres alignes. */
  .arc-nb {
    min-width: 34px; text-align: right; font-variant-numeric: tabular-nums;
    font-weight: 700; color: var(--texte);
  }
  .arc-nb.arc-zero { color: var(--attenue); font-weight: 400; }
  /* Qui a encore quelque chose a y prendre. Deux personnages de la meme classe
     portent le meme embleme: le survol donne le nom, c'est ce qui les separe. */
  .arc-qui { display: flex; gap: 4px; min-width: 96px; justify-content: flex-end; }
  .arc-qui img { width: 18px; height: 18px; border-radius: 4px; }
  .arc-qui .arc-abrev {
    font-size: 9.5px; font-weight: 700; color: var(--attenue);
    border: 1px solid var(--filet); border-radius: 4px; padding: 1px 3px;
  }

  /* Le bouton rond de l'en-tete: redemander les inventaires. Rond parce qu'il
     REPETE quelque chose, la ou la croix voisine termine. */
  .arc-relire {
    margin-left: auto; width: 30px; height: 30px; padding: 0;
    display: grid; place-items: center;
    background: transparent; border: 1px solid var(--filet); border-radius: 50%;
    color: var(--attenue);
  }
  .arc-relire:hover:not(:disabled) { color: var(--texte); border-color: var(--accent); }
  .arc-relire:disabled { opacity: .4; cursor: progress; }
  .arc-relire svg { width: 15px; height: 15px; }
  /* La croix garde sa place a droite: c'est le bouton rond qui pousse. */
  .qdn-tete .arc-relire + button { margin-left: 4px; }

  /* Le troisieme niveau: ce qu'il manque nommement dans une sous-zone. */
  .arc-archi {
    display: flex; align-items: center; gap: 10px;
    padding: 5px 6px 5px 56px; border-bottom: 1px solid rgba(255,255,255,.03);
    font-size: 12px; color: var(--attenue);
  }
  .arc-niveau {
    min-width: 30px; text-align: right; font-variant-numeric: tabular-nums;
  }

  .arc-pied {
    padding: 9px 15px; border-top: 1px solid var(--filet);
    font-size: 12px; color: var(--attenue);
    display: flex; gap: 16px; flex-wrap: wrap;
  }
  .arc-pied b { color: var(--texte); font-variant-numeric: tabular-nums; }

  .oter:hover { color: var(--alerte); background: rgba(242,84,91,.12); }
  .oter svg { width: 12px; height: 12px; }

  .paire { display: inline-flex; align-items: center; gap: 7px; }
  /* Le refus de la derniere bascule. Il s efface seul au bout de dix
     secondes: passe ce delai il ne decrit plus rien. */
  .avis-nav {
    text-transform: none; letter-spacing: 0; font-weight: 400;
    font-size: 12.5px; color: var(--alerte);
  }
  .avis-nav:empty { display: none; }

  /* ---------------- la liste ---------------- */
  .defile { flex: 1; min-height: 0; overflow-y: auto; }
  .entete, .rang {
    display: grid; align-items: center;
    grid-template-columns: 50px minmax(150px, 1.6fr) 92px repeat(5, 58px) 122px 44px 52px 38px;
    gap: 9px; padding: 0 15px;
  }
  .entete {
    padding-top: 10px; padding-bottom: 10px;
    border-bottom: 1px solid var(--filet);
    font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--attenue); font-weight: 700;
    position: sticky; top: 0; background: var(--fond); z-index: 1;
  }
  .entete .c { text-align: center; }
  /* Le titre de colonne est une ACTION GROUPEE: il coche ou decoche la fonction
     pour tout le monde. Le losange dit ou en est la colonne — plein, creux, ou
     a moitie quand seuls certains comptes l ont. */
  .tete-colonne {
    display: inline-flex; align-items: center; gap: 5px; justify-content: center;
    width: 100%; padding: 7px 2px; border: 0; background: transparent;
    color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit;
    border-radius: 6px;
  }
  .tete-colonne:hover { background: rgba(255,255,255,.06); color: var(--texte); }
  .tete-colonne:disabled { opacity: .3; cursor: not-allowed; }
  .jauge {
    width: 8px; height: 8px; flex: none; transform: rotate(45deg); border-radius: 4px;
    border: 1.5px solid var(--bord); background: transparent;
  }
  .jauge.tous { background: var(--arme); border-color: var(--arme); }
  /* A moitie: la diagonale du losange une fois redresse, donc une moitie
     franche et lisible meme a 8 px. */
  .jauge.partiel {
    border-color: var(--arme);
    background: linear-gradient(to right, var(--arme) 50%, transparent 50%);
  }
  .rang {
    padding-top: 11px; padding-bottom: 11px;
    border-bottom: 1px solid var(--filet); position: relative;
  }
  .rang.hors-ligne { opacity: .4; }
  /* Le rang qui commande porte un lisere d'or: on marque sans repeindre. */
  .rang.commande { background: linear-gradient(90deg, rgba(255,159,28,.09), transparent 55%); }
  .rang.commande::before {
    content: ""; position: absolute; left: 0; top: 5px; bottom: 5px; width: 3px;
    border-radius: 0 3px 3px 0; background: var(--commande);
  }

  /* La plaque en losange accueillera l'embleme de classe. En attendant elle
     porte l'abreviation, pour que l'information ne soit pas perdue avec la
     colonne « Classe » qui la doublait. */
  .plaque {
    width: 30px; height: 30px; margin: 0 auto;
    display: grid; place-items: center;
    background: var(--releve); border: 1px solid var(--bord);
    transform: rotate(45deg); border-radius: 10px;
  }
  .plaque > * {
    transform: rotate(-45deg); font-size: 10px; font-weight: 700;
    letter-spacing: .02em; color: var(--attenue);
  }
  .plaque img { width: 22px; height: 22px; object-fit: contain; display: block; }
  .rang.hors-ligne .plaque img { filter: grayscale(1); }
  .rang.commande .plaque { border-color: var(--commande); box-shadow: 0 0 10px rgba(255,159,28,.28); }
  .rang.alerte .plaque { border-color: var(--alerte); }

  .identite {
    display: contents;
  }
  .zone-clic { cursor: pointer; }
  .zone-clic:hover .nom { color: var(--commande); }
  .zone-clic:hover .plaque { border-color: var(--commande); }
  .nom {
    font-weight: 700; font-size: 14.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sous-nom {
    font-size: 12px; color: var(--attenue);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sous-nom.absent { color: var(--filet); font-style: italic; }

  /* LA CIBLE EST LA CELLULE ENTIERE, le losange n est qu un dessin dedans.
     Un element tourne a 45 degres n est sensible que sur la moitie de sa
     boite: viser un coin ne declenche rien, et c est exactement ce qui faisait
     rater des clics. Le bouton fait donc 58 x 30, le losange 17. */
  .case {
    display: grid; place-items: center;
    width: 100%; height: 30px; padding: 0;
    background: transparent; border: 0;
  }
  .case .los {
    width: 17px; height: 17px; transform: rotate(45deg); border-radius: 6px;
    border: 1.5px solid var(--bord); background: transparent;
    transition: background .1s, border-color .1s;
  }
  .case.on .los { background: var(--arme); border-color: var(--arme); }
  .case:disabled { opacity: .25; cursor: not-allowed; }
  .case:not(:disabled):hover .los { border-color: var(--attenue); }
  .case:not(:disabled):hover { background: rgba(255,255,255,.05); border-radius: 8px; }

  .bouton-commande {
    width: 100%; min-height: 28px; padding: 6px 9px; border-radius: 999px;
    border: 1px solid var(--bord); background: transparent; color: var(--attenue);
    font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
    white-space: nowrap;
  }
  .bouton-commande:hover { border-color: var(--commande); color: var(--commande); }
  .bouton-commande.on {
    background: var(--commande); border-color: var(--commande);
    color: var(--commande-encre);
  }
  .verdict {
    display: inline-flex; align-items: center; gap: 7px; justify-content: center;
    width: 100%; font-size: 11px; font-weight: 700; letter-spacing: .05em;
    text-transform: uppercase; white-space: nowrap;
  }
  .verdict .los { width: 11px; height: 11px; flex: none; transform: rotate(45deg); border-radius: 4px; }
  .verdict.alerte { color: var(--alerte); }
  .verdict.alerte .los { background: var(--alerte); }
  .verdict.attente { color: var(--attenue); }
  .verdict.attente .los { border: 1.5px solid var(--attenue); }
  .verdict.calme { color: var(--filet); }
  .verdict.calme .los { border: 1.5px solid var(--filet); }

  .motif {
    grid-column: 2 / -1; font-size: 12px; color: var(--alerte);
    margin-top: -2px; padding-bottom: 2px;
  }

  /* Zero client detecte donnait une page blanche sous l'en-tete.
     LE NOM EST PREFIXE A DESSEIN. Cette regle s'appelait `.vide`, et le
     bouton de touche non assignee portait la meme classe: son padding de
     44 px gagnait, le bouton passait de 27 a 110 px de haut, et le rang
     entier a 133 px au lieu de 60. Une classe aussi generique finit
     toujours par en attraper une autre. */
  .liste-vide { padding: 44px 20px; text-align: center; color: var(--attenue); font-size: 13.5px; }
  .liste-vide b { display: block; color: var(--texte); font-size: 15px; margin-bottom: 6px; font-weight: 700; }
</style>
